# ═══════════════════════════════════════════════════════════
# VILLA LUZI · NETLIFY.TOML
# Build: include a build-time (build.js, zero dipendenze) → dist/
# URL puliti nativi: ogni route è una cartella con index.html.
# ═══════════════════════════════════════════════════════════

[build]
  command = "node build.js"
  publish = "dist"

# ─── Redirect 301 · vecchi URL della pagina evento "2 giugno" ───
[[redirects]]
  from = "/2-giugno.html"
  to = "/esperienze/aperitivi-in-erba/2-giugno-2026/"
  status = 301

[[redirects]]
  from = "/2-giugno"
  to = "/esperienze/aperitivi-in-erba/2-giugno-2026/"
  status = 301

# ─── URL pulito · landing evento "White Party" ───
# La pagina vive SOLO come cartella 19-giugno/index.html (URL pulito /19-giugno,
# convenzione del sito). Il vecchio /19-giugno.html (destinazione campagna Meta)
# viene reindirizzato con force=true: la regola ha precedenza sulla gestione
# automatica dei .html di Netlify, quindi è deterministica. Niente file .html a root
# → nessuna ambiguità con la cartella.
[[redirects]]
  from = "/19-giugno.html"
  to = "/19-giugno"
  status = 301
  force = true

# Normalizza /index.html → /
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# ─── Headers ───
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
