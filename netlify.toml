# ═══════════════════════════════════════════════════════════
# VILLA LUZI · NETLIFY.TOML
# Build: include a build-time (build.js, zero dipendenze) → dist/
# URL puliti nativi: ogni route è una cartella con index.html.
# ═══════════════════════════════════════════════════════════

[build]
  command = "node build.js"
  publish = "dist"

# ─── Redirect 301 · vecchi URL della pagina evento "2 giugno" ───
[[redirects]]
  from = "/2-giugno.html"
  to = "/esperienze/aperitivi-in-erba/2-giugno-2026/"
  status = 301

[[redirects]]
  from = "/2-giugno"
  to = "/esperienze/aperitivi-in-erba/2-giugno-2026/"
  status = 301

# ─── URL pulito · landing evento "White Party" ───
# Nessun redirect: la pagina è servita come file statico a entrambi gli URL.
#   /19-giugno      → cartella 19-giugno/index.html (URL pulito, convenzione del sito)
#   /19-giugno.html → alias emesso da build.js (stessa sorgente), per i click già in
#                     circolazione dalla campagna Meta. Il canonical punta a /19-giugno.

# Normalizza /index.html → /
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# ─── Headers ───
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
