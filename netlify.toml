# ═══════════════════════════════════════════════════════════
# VILLA LUZI · NETLIFY.TOML
# Build: include a build-time (build.js, zero dipendenze) → dist/
# URL puliti nativi: ogni route è una cartella con index.html.
# ═══════════════════════════════════════════════════════════

[build]
  command = "node build.js"
  publish = "dist"

# ─── Redirect 301 · vecchi URL della pagina evento "2 giugno" ───
[[redirects]]
  from = "/2-giugno.html"
  to = "/esperienze/aperitivi-in-erba/2-giugno-2026/"
  status = 301

[[redirects]]
  from = "/2-giugno"
  to = "/esperienze/aperitivi-in-erba/2-giugno-2026/"
  status = 301

# ─── Redirect 301 · vecchi URL della landing evento "White Party" ───
# La pagina è stata spostata sotto /eventi/white-party/ come pagina d'archivio.
# I vecchi URL (incluso /19-giugno.html, destinazione campagna Meta) vengono
# reindirizzati con force=true: la regola ha precedenza sulla gestione automatica
# dei .html di Netlify, quindi è deterministica.
[[redirects]]
  from = "/19-giugno"
  to = "/eventi/white-party/"
  status = 301
  force = true

[[redirects]]
  from = "/19-giugno.html"
  to = "/eventi/white-party/"
  status = 301
  force = true

# ─── Redirect 301 · vecchi URL "White Party — la lista" e "La Domenica" ───
[[redirects]]
  from = "/white-party-lista.html"
  to = "/eventi/white-party/lista/"
  status = 301

[[redirects]]
  from = "/la-domenica.html"
  to = "/eventi/la-domenica/"
  status = 301

# ─── Redirect 301 · Matrimoni promossa a sezione di primo livello ───
# Spostata da /eventi/matrimoni/ a /matrimoni/ (link vecchi, anche dalla
# pagina bloccata Il Segreto, restano funzionanti).
[[redirects]]
  from = "/eventi/matrimoni/"
  to = "/matrimoni/"
  status = 301
  force = true

[[redirects]]
  from = "/eventi/matrimoni"
  to = "/matrimoni/"
  status = 301
  force = true

# Normalizza /index.html → /
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# ─── Headers ───
# Media (immagini, video): cache lunga immutable — cambiano di rado e, se serve,
# si caricano con nome nuovo.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS: NON hanno un hash nel nome → MAI 'immutable' (servirebbe la versione
# vecchia per un anno dopo ogni modifica). Si rivalidano sempre (304 economici).
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML: sempre fresco
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
